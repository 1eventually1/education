<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="AI teacher robot">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f0ff"/>
      <stop offset="1" stop-color="#eaf2ff"/>
    </linearGradient>
    <linearGradient id="body" x1="0.18" x2="0.84" y1="0.05" y2="0.94">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#dfe9ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0.2" x2="0.9" y1="0.1" y2="0.92">
      <stop offset="0" stop-color="#6dc9ff"/>
      <stop offset="1" stop-color="#5e66f2"/>
    </linearGradient>
    <linearGradient id="screen" x1="0.12" x2="0.91" y1="0.08" y2="1">
      <stop offset="0" stop-color="#17214d"/>
      <stop offset="1" stop-color="#071b48"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#5266d8" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="640" height="640" rx="42" fill="url(#bg)"/>
  <circle cx="160" cy="92" r="58" fill="#ffffff" opacity="0.32"/>
  <circle cx="515" cy="155" r="76" fill="#ffffff" opacity="0.24"/>
  <circle cx="455" cy="478" r="86" fill="#ffffff" opacity="0.20"/>

  <g filter="url(#soft)">
    <path d="M196 514c12-68 63-114 124-114s112 46 124 114c3 18-11 34-29 34H225c-18 0-32-16-29-34Z" fill="url(#body)"/>
    <path d="M252 548c10-76 54-126 68-126s58 50 68 126H252Z" fill="#f7fbff"/>
    <circle cx="320" cy="454" r="35" fill="url(#blue)" opacity="0.92"/>
    <ellipse cx="320" cy="454" rx="24" ry="14" fill="#7fe8ff" opacity="0.45"/>

    <rect x="181" y="144" width="278" height="238" rx="95" fill="url(#body)"/>
    <rect x="162" y="184" width="316" height="162" rx="58" fill="url(#screen)"/>
    <ellipse cx="260" cy="264" rx="25" ry="42" fill="#38dfff" filter="url(#glow)"/>
    <ellipse cx="380" cy="264" rx="25" ry="42" fill="#38dfff" filter="url(#glow)"/>
    <path d="M291 329c18 15 41 15 59 0" fill="none" stroke="#7c8ed8" stroke-width="9" stroke-linecap="round"/>

    <path d="M162 247c-39 2-67 31-67 68 0 32 21 58 52 66" fill="none" stroke="url(#blue)" stroke-width="18" stroke-linecap="round"/>
    <path d="M478 247c39 2 67 31 67 68" fill="none" stroke="url(#blue)" stroke-width="18" stroke-linecap="round"/>
    <rect x="92" y="233" width="58" height="122" rx="26" fill="url(#blue)"/>
    <rect x="490" y="233" width="58" height="122" rx="26" fill="url(#blue)"/>
    <path d="M112 361c13 44 45 73 93 82" fill="none" stroke="#6474ec" stroke-width="13" stroke-linecap="round"/>
    <rect x="184" y="426" width="54" height="22" rx="11" fill="#5f74f4"/>

    <path d="M260 138c4-36 28-57 60-57s56 21 60 57" fill="none" stroke="#8fb9ff" stroke-width="14" stroke-linecap="round"/>
    <rect x="278" y="48" width="84" height="44" rx="22" fill="url(#blue)"/>
